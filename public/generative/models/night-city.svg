<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B2A"/>
      <stop offset="0.55" stop-color="#141040"/>
      <stop offset="1" stop-color="#251358"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7FF"/>
      <stop offset="0.5" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#C46BFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="240" fill="url(#sky)"/>
  <!-- skyline en formes simples -->
  <g fill="#0A0920">
    <rect x="0" y="150" width="52" height="90"/>
    <rect x="58" y="122" width="40" height="118"/>
    <rect x="104" y="164" width="34" height="76"/>
    <rect x="144" y="108" width="46" height="132"/>
    <rect x="196" y="146" width="30" height="94"/>
    <rect x="452" y="140" width="38" height="100"/>
    <rect x="496" y="112" width="48" height="128"/>
    <rect x="550" y="152" width="32" height="88"/>
    <rect x="588" y="126" width="44" height="114"/>
    <rect x="636" y="158" width="44" height="82"/>
    <rect x="160" y="96" width="8" height="14"/>
    <rect x="512" y="100" width="8" height="12"/>
  </g>
  <!-- fenêtres -->
  <g fill="#6FD9FF" opacity="0.6">
    <rect x="66" y="132" width="4" height="6"/><rect x="78" y="146" width="4" height="6"/>
    <rect x="152" y="120" width="4" height="6"/><rect x="168" y="138" width="4" height="6"/>
    <rect x="176" y="158" width="4" height="6"/><rect x="504" y="124" width="4" height="6"/>
    <rect x="522" y="142" width="4" height="6"/><rect x="596" y="138" width="4" height="6"/>
    <rect x="610" y="160" width="4" height="6"/><rect x="462" y="152" width="4" height="6"/>
  </g>
  <!-- lune froide -->
  <circle cx="600" cy="52" r="22" fill="#CFE4FF" opacity="0.85"/>
  <circle cx="592" cy="46" r="20" fill="url(#sky)"/>
  <!-- le nom, néon -->
  <text x="340" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="14" fill="url(#neon)" filter="url(#glow)">NEVA</text>
  <text x="340" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="14" fill="none" stroke="#EAF6FF" stroke-width="1" opacity="0.65">NEVA</text>
  <text x="340" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="8" fill="#8FD8FF" opacity="0.8">NIGHT CITY ROLEPLAY</text>
  <!-- reflet au sol -->
  <g opacity="0.22" transform="translate(0,266) scale(1,-0.5)">
    <text x="340" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="14" fill="url(#neon)">NEVA</text>
  </g>
</svg>
